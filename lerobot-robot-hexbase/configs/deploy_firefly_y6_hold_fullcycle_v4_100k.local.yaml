    arm_target_settle_rad: [0.002, 0.002, 0.002, 0.002, 0.002, 0.002]
    opening_timeout_ms: 1500.0
    seeking_timeout_ms: 20000.0
    descent_step_m: 0.0
    max_total_descent_m: 0.0
    allow_close: false
